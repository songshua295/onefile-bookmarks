<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3">
<title>书签</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🔖</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <div class="row1">
    <span id="logo">书签</span>
    <span id="recents-label">最近打开</span>
    <div id="recents"></div>
    <span id="dirty-badge" hidden>● 未上传</span>
  </div>
  <div class="row2">
    <input id="search" type="search" autocomplete="off"
           placeholder="搜索书签…(空格分隔多个关键字,支持模糊匹配)">
    <span class="btn-sep"></span>
    <button id="collapse-btn" class="btn-fn" title="收缩所有展开的书签文件夹">全部收缩</button>
    <button id="add-bm-btn" class="btn-fn" title="添加书签(可选择或搜索文件夹)">+ 书签</button>
    <button id="add-folder-btn" class="btn-fn" title="添加文件夹">+ 文件夹</button>
    <span class="btn-sep"></span>
    <button id="upload-btn" class="btn-fn" title="把本地更改增量上传到云端(只传有改动的书签,与其他设备的修改按条自动合并)">上传</button>
    <button id="sync-btn" class="btn-fn" title="强制拉取云端最新数据覆盖本地缓存(有未上传的本地修改时会先询问)">同步云端</button>
    <span class="more-wrap">
      <button id="more-btn" class="btn-fn" title="更多功能">更多</button>
      <div id="more-menu" hidden>
        <button id="download-btn" title="把当前书签导出为浏览器可直接导入的 HTML 文件">导出书签 HTML</button>
        <button id="import-btn" title="选择本地书签 HTML 或 JSON 文件,用它覆盖云端全部数据(慎用)">用本地文件覆盖云端…</button>
        <a id="bookmarklet" href="#" title="把我拖到浏览器书签栏,之后在任何页面点击即可快速收藏。按当前访问域名生成:从本地页面拖取会指向 localhost,部署后请从线上页面重新拖取">获取快速添加按钮…</a>
      </div>
    </span>
    <input id="import-file" type="file" accept=".html,.json,text/html,application/json" hidden>
    <span id="status"></span>
  </div>
</header>
<main id="content">
  <div id="tree"></div>
  <div id="results" hidden></div>
</main>

<div id="modal-root" hidden>
  <div id="modal-mask"></div>
  <div id="modal-box"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
